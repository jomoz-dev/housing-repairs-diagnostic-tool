<!DOCTYPE html>
<html>

<head>

    <title>Housing Repairs Diagnostic Tool</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="result-card">

    <h1>Housing Repairs Diagnostic Tool</h1>

    {% include "signed_in.html" %}

    <div class="nav-links">
        <a href="/dashboard" class="button">Dashboard</a>
        <a href="/history" class="button">History</a>
        <a href="/search" class="button">Search</a>
        <a href="/export" class="button">Export CSV</a>
    </div>

    <p>
        Select the repair type to begin the assessment.
    </p>

    <form action="/assessment" method="POST">

        <select name="repair_type">

            <option value="water_leak">Water Leak</option>

            <option value="electrical">Electrical</option>

            <option value="heating">Heating</option>

            <option value="damp_mould">Damp & Mould</option>

            <option value="roofing">Roofing</option>

            <option value="doors_windows">Doors & Windows</option>

        </select>

        <br><br>

        <button type="submit">
            Continue
        </button>

    </form>

</div>

</body>

</html>
