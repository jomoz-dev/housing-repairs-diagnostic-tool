<!DOCTYPE html>
<html>

<head>
    <title>Housing Repairs Diagnostic Tool</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="result-card">

        <h1>Housing Repairs Diagnostic Tool</h1>

        <p>
            Complete the assessment below to determine the repair priority.
        </p>

        <form action="/diagnose" method="POST">

            <h2>Safety Assessment</h2>

            <label>
                Is anyone currently in immediate danger?
            </label>

            <br><br>

            <select name="danger">

                <option value="no">No</option>

                <option value="yes">Yes</option>

            </select>

            <br><br>

            <label>
                Is the property unsafe to occupy?
            </label>

            <br><br>

            <select name="unsafe_property">

                <option value="no">No</option>

                <option value="yes">Yes</option>

            </select>

            <br><br>

            <label>
                Is there a vulnerable resident?
            </label>

            <br><br>

            <select name="vulnerable">

                <option value="no">No</option>

                <option value="yes">Yes</option>

            </select>

            <br><br>

            <h2>Repair Type</h2>

            <select name="repair_type">

                <option value="heating">Heating</option>

                <option value="water_leak">Water Leak</option>

                <option value="electrical">Electrical</option>

                <option value="damp">Damp & Mould</option>

                <option value="roof">Roofing</option>

            </select>

            <br><br>

            <label>
                Is water actively escaping?
            </label>

            <br><br>

            <label>
                Can the leak be contained?
            </label>

            <br><br>

            <select name="contained">

                <option value="yes">Yes</option>

                <option value="no">No</option>

            </select>

            <br><br>

            <label>
                Is the leak affecting electrical fittings?
            </label>

            <br><br>

            <select name="electrics_affected">

                <option value="no">No</option>

                <option value="yes">Yes</option>

            </select>
            <br><br>

            <select name="active_leak">

                <option value="no">No</option>

                <option value="yes">Yes</option>

            </select>

            <br><br>

            <button type="submit">
                Diagnose Repair
            </button>

        </form>

    </div>

</body>

</html>
