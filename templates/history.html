<!DOCTYPE html>
<html>

<head>

    <title>Assessment History</title>

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body>

<div class="result-card">

    <h1>Assessment History</h1>
    
    <form method="GET" action="/history">

    <label>Priority</label>
    <br>
    <select name="priority">

        <option value="">
            All Priorities
        </option>

        <option value="Emergency"
            {% if selected_priority == "Emergency" %}selected{% endif %}>
            Emergency
        </option>

        <option value="Urgent"
            {% if selected_priority == "Urgent" %}selected{% endif %}>
            Urgent
        </option>

        <option value="Routine"
            {% if selected_priority == "Routine" %}selected{% endif %}>
            Routine
        </option>
    </select>

    <br><br>

    <label>Repair type</label>
    <br>
    <select name="repair_type">

        <option value="">
            All Repair Types
        </option>

        <option value="water_leak"
            {% if selected_repair_type == "water_leak" %}selected{% endif %}>
            Water Leak
        </option>

        <option value="electrical"
            {% if selected_repair_type == "electrical" %}selected{% endif %}>
            Electrical
        </option>

        <option value="heating"
            {% if selected_repair_type == "heating" %}selected{% endif %}>
            Heating
        </option>

        <option value="roofing"
            {% if selected_repair_type == "roofing" %}selected{% endif %}>
            Roofing
        </option>

        <option value="damp_mould"
            {% if selected_repair_type == "damp_mould" %}selected{% endif %}>
            Damp & Mould
        </option>

        <option value="doors_windows"
            {% if selected_repair_type == "doors_windows" %}selected{% endif %}>
            Doors & Windows
        </option>

    </select>

    <br><br>

    <label>From</label>
    <br>
    <input type="date" name="date_from" value="{{ date_from }}">

    <br><br>

    <label>To</label>
    <br>
    <input type="date" name="date_to" value="{{ date_to }}">

    <br><br>

    <button type="submit">
        Filter
    </button>

    <a href="/history" class="button">
        Clear
    </a>

    </form>

    <br>

    <table>

        <tr>

            <th>Reference</th>

            <th>Repair Type</th>

            <th>Priority</th>

            <th>Trade</th>

            <th>Assessment Date</th>

        </tr>

        {% for row in records %}

        <tr>

            <td>{{ row.reference }}</td>

            <td>{{ row.repair_type }}</td>

            <td>{{ row.priority }}</td>

            <td>{{ row.trade }}</td>

            <td>{{ row.assessment_date }}</td>

        </tr>

        {% endfor %}

    </table>


    <br><br>

    <a href="/dashboard" class="button">

    Dashboard

    </a>
    <p></p>
    <br><br>

    <a href="/" class="button">

        Back To Tool

    </a>

</div>

</body>

</html>
