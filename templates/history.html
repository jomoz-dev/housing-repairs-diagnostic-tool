<!DOCTYPE html>
<html>

<head>

    <title>Assessment History</title>

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body>

<div class="result-card">

    <h1>Assessment History</h1>
    
    <form method="GET" action="/history">

    <select name="priority">

        <option value="">
            All Priorities
        </option>

        <option value="Emergency">
            Emergency
        </option>

        <option value="Urgent">
            Urgent
        </option>

        <option value="Routine">
            Routine
        </option>

    </select>

    <button type="submit">
        Filter
    </button>

    <table>

        <tr>

            <th>Reference</th>

            <th>Repair Type</th>

            <th>Priority</th>

            <th>Trade</th>

        </tr>

        {% for row in records %}

        <tr>

            <td>{{ row.reference }}</td>

            <td>{{ row.repair_type }}</td>

            <td>{{ row.priority }}</td>

            <td>{{ row.trade }}</td>

        </tr>

        {% endfor %}

    </table>


    <br><br>

    <a href="/dashboard" class="button">

    Dashboard

    </a>
    <p></p>
    <br><br>

    <a href="/" class="button">

        Back To Tool

    </a>

    
    
</form>


</div>

</body>

</html>
