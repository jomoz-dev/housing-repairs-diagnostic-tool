<!DOCTYPE html>
<html>

<head>

    <title>Assessment History</title>

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body>

<div class="result-card">

    <h1>Assessment History</h1>
    
    <form method="GET" action="/history">

    <select name="priority">

        <option value="">
            All Priorities
        </option>

        <option value="Emergency">
            Emergency
        </option>

        <option value="Urgent">
            Urgent
        </option>

        <option value="Routine">
            Routine
        </option>
    </select>

    <select name="repair_type">

        <option value="">
            All Repair Types
        </option>

        <option value="water_leak">
            Water Leak
        </option>

        <option value="electrical">
            Electrical
        </option>

        <option value="heating">
            Heating
        </option>

        <option value="roofing">
            Roofing
        </option>

        <option value="damp_mould">
            Damp & Mould
        </option>

        <option value="doors_windows">
            Doors & Windows
        </option>


    </select>

    <button type="submit">
        Filter
    </button>

    <table>

        <tr>

            <th>Reference</th>

            <th>Repair Type</th>

            <th>Priority</th>

            <th>Trade</th>

            <th>Assessment Date</th>

        </tr>

        {% for row in records %}

        <tr>

            <td>{{ row.reference }}</td>

            <td>{{ row.repair_type }}</td>

            <td>{{ row.priority }}</td>

            <td>{{ row.trade }}</td>

            <td>{{ row.assessment_date }}</td>

        </tr>

        {% endfor %}

    </table>


    <br><br>

    <a href="/dashboard" class="button">

    Dashboard

    </a>
    <p></p>
    <br><br>

    <a href="/" class="button">

        Back To Tool

    </a>

    
    
</form>


</div>

</body>

</html>
