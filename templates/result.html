<!DOCTYPE html>
<html>

<head>
    <title>Diagnosis Result</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="result-card">

    <h1>Repair Assessment Result</h1>

    <h2>Priority</h2>

    <p>{{ result.priority }}</p>

    <h2>Recommended Trade</h2>

    <p>{{ result.trade }}</p>

    <h2>Attendance Target</h2>

    <p>{{ result.attendance }}</p>

    <h2>Assessment Notes</h2>

    <p>{{ result.message }}</p>

    <a href="/" class="button">
        Start New Assessment
    </a>

</div>

</body>

</html>
