<!DOCTYPE html>
<html>

<head>

    <title>Repair Assessment Result</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <div class="result-card">

        <h1>Repair Assessment Result</h1>

        <h2>Priority</h2>

        <div class="priority-box">
            {{ result.priority }}
        </div>

        <p><strong>Trade:</strong> {{ result.trade }}</p>

        <p><strong>Attendance:</strong> {{ result.attendance }}</p>

        <p><strong>Reason:</strong> {{ result.message }}</p>

        <br>

        <a href="/" class="button">

            Start New Assessment

        </a>

    </div>

</body>

</html>
